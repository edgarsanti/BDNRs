<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" width="1600" height="870"><rect x="0" y="0" width="1600" height="870" rx="0" fill="#F6F9FE" stroke="none" stroke-width="0" /><rect x="42" y="38" width="1516" height="793" rx="22" fill="#FFFFFF" stroke="#E3EBF5" stroke-width="2" /><rect x="100" y="88" width="10" height="52" rx="4" fill="#3769C7" stroke="none" stroke-width="0" /><text x="136" y="94" font-family="Lato,Arial,sans-serif" font-size="19" font-weight="700" fill="#3769C7" text-anchor="start" opacity="1">APUNTE 17   /   RENDIMIENTO DE CONSULTAS</text><text x="136" y="157" font-family="Lato,Arial,sans-serif" font-size="45" font-weight="800" fill="#193456" text-anchor="start" opacity="1">El índice reduce los accesos a la base</text><text x="136" y="198" font-family="Lato,Arial,sans-serif" font-size="22" font-weight="400" fill="#60728B" text-anchor="start" opacity="1">Comparación de la misma búsqueda por IATA con PROFILE, antes y después del índice.</text><line x1="136" y1="231" x2="1464" y2="231" stroke="#DFE7F2" stroke-width="2" opacity="1" /><rect x="136" y="276" width="638" height="260" rx="21" fill="#F4F8FD" stroke="#E1EAF4" stroke-width="2" /><text x="173" y="336" font-family="Lato,Arial,sans-serif" font-size="24" font-weight="700" fill="#60728B" text-anchor="start" opacity="1">SIN ÍNDICE</text><text x="173" y="444" font-family="Lato,Arial,sans-serif" font-size="102" font-weight="800" fill="#3769C7" text-anchor="start" opacity="1">3,198</text><text x="173" y="486" font-family="Lato,Arial,sans-serif" font-size="23" font-weight="400" fill="#60728B" text-anchor="start" opacity="1">DB hits · accesos reportados</text><rect x="818" y="276" width="638" height="260" rx="21" fill="#F4F8FD" stroke="#E1EAF4" stroke-width="2" /><text x="855" y="336" font-family="Lato,Arial,sans-serif" font-size="24" font-weight="700" fill="#60728B" text-anchor="start" opacity="1">CON ÍNDICE</text><text x="855" y="444" font-family="Lato,Arial,sans-serif" font-size="102" font-weight="800" fill="#25ACAF" text-anchor="start" opacity="1">63</text><text x="855" y="486" font-family="Lato,Arial,sans-serif" font-size="23" font-weight="400" fill="#60728B" text-anchor="start" opacity="1">DB hits · accesos reportados</text><rect x="136" y="564" width="1320" height="104" rx="18" fill="#ECF8F7" stroke="none" stroke-width="0" /><text x="170" y="628" font-family="Lato,Arial,sans-serif" font-size="41" font-weight="800" fill="#127F7D" text-anchor="start" opacity="1">98.0 % menos accesos</text><text x="1425" y="623" font-family="Lato,Arial,sans-serif" font-size="30" font-weight="700" fill="#19304D" text-anchor="end" opacity="1">3,198  →  63</text><text x="138" y="723" font-family="Lato,Arial,sans-serif" font-size="22" font-weight="700" fill="#19304D" text-anchor="start" opacity="1">Tiempo observado: 112 ms sin índice y 144 ms con índice.</text><text x="138" y="755" font-family="Lato,Arial,sans-serif" font-size="21" font-weight="400" fill="#60728B" text-anchor="start" opacity="1">Una ejecución no permite concluir que el tiempo de respuesta haya mejorado.</text><line x1="136" y1="765" x2="1464" y2="765" stroke="#E0EAF3" stroke-width="2" opacity="1" /><text x="136" y="803" font-family="Lato,Arial,sans-serif" font-size="19" font-weight="400" fill="#60728B" text-anchor="start" opacity="1">Fuente: OpenFlights (datos históricos) · consultas Cypher del apunte.</text><text x="1464" y="803" font-family="Lato,Arial,sans-serif" font-size="17" font-weight="700" fill="#8597AB" text-anchor="end" opacity="1">BASES DE DATOS NO RELACIONALES</text></svg>